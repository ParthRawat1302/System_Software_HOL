server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        # SPA fallback: this app has no client-side router today, but
        # this keeps a hard refresh working if one gets added later.
        try_files $uri $uri/ /index.html;
    }
}
